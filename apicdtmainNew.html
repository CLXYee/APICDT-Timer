<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚太辩计时器</title>
    <link rel="stylesheet" href="apicdtmain.css">
</head>
<body>
    <!-- 环节零：Cover Page -->
    <div id="cover-page">
        <h1><p class="pageTitle">第十二届 亚太大专华语辩论公开赛</p></h1><h1>大赛计时器</h1><br>
        <input type="text" class="custom-textbox" id="title" placeholder="请输入比赛标题"><br><br><br>
        <h2>手动输入</h2>
        <input type="text" id="affirmative-team" placeholder="正方队名">
        <input type="text" id="affirmative-topic" placeholder="正方辩题">
        <input type="text" id="negative-team" placeholder="反方队名">
        <input type="text" id="negative-topic" placeholder="反方辩题">
        <button id="proceed-to-info">下一步</button>

        <hr class="spacing">
        <h2>选择比赛场次</h2>
        <div id="contest-presets" aria-label="选择比赛场次"></div>
    </div>

    <!-- 计时器页面 -->
    <div id="timer-page" style="display: none;">
        <br><h1>第十二届亚太大专华语辩论公开赛</h1><br>
        <div id="match-info" class="match-info-container">
            <h2 id="match-title"></h2><br>
            <div id="team-topics">
                <div class="team-info affirmative">
                    <h3>正方</h3><br>
                    <h2><strong id="affirmative-name"></strong></h2><br>
                    <h3><span id="affirmative-debate"></span></h3>
                </div>
                <div class="team-info negative">
                    <h3>反方</h3><br>
                    <h2><strong id="negative-name"></strong></h2><br>
                    <h3><span id="negative-debate"></span></h3>
                </div>
            </div>
        </div>        
        

        <br>
        <h2 id="phase-title">环节1：立论</h2>
        <h1 id="phase-title-notime"><br><br>环节</h1>
        <div id="timers">
            <div class="timer" id="affirmative-timer">
                <h3>正方计时</h3>
                <p id="affirmative-time">03:30</p>
                <button onclick="startTimer('affirmative')">开始</button>
                <button onclick="stopTimer('affirmative')">停止</button>
                <button onclick="resetTimer('affirmative')">重置</button>
            </div>
            <div class="timer" id="negative-timer">
                <h3>反方计时</h3>
                <p id="negative-time">03:30</p>
                <button onclick="startTimer('negative')">开始</button>
                <button onclick="stopTimer('negative')">停止</button>
                <button onclick="resetTimer('negative')">重置</button>
            </div>
            <div class="timer" id="general-timer">
                <h3>计时</h3>
                <p id="general-time">10:00</p>
                <button onclick="startTimer('general')">开始</button>
                <button onclick="stopTimer('general')">停止</button>
                <button onclick="resetTimer('general')">重置</button>
            </div>
        </div>

        <div id="controls">
            <button onclick="prevPhase()">上一环节</button>
            <button onclick="nextPhase()">下一环节</button>
            <button onclick="soundFlag === 1 ? playSound2() : playSound()">播放提示音</button>
        </div>
    </div>

    <audio id="bell-sound" src="bell.wav"></audio>
    <audio id="bell-sound2" src="endBell.wav"></audio>
    <script src="contest-data.js"></script>
    <script src="apicdtmainNew.js"></script>
</body>
</html>

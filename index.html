<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚太辩计时器 | 模式选择</title>
    <link rel="stylesheet" href="mode-selection.css">
</head>
<body>
    <main class="mode-page">
        <p class="eyebrow">第十二届 亚太大专华语辩论公开赛</p>
        <h1>大赛计时器</h1>
        <p class="intro">请选择要使用的计时模式</p>

        <div class="mode-actions" aria-label="计时模式选择">
            <button class="mode-button contest-mode" type="button" onclick="window.location.href='apicdtmainNew.html'">
                <span class="mode-label">Contest Mode</span>
                <span class="mode-description">正式比赛计时</span>
            </button>
            <button class="mode-button roadshow-mode" type="button" onclick="window.location.href='apicdtRoadshow.html'">
                <span class="mode-label">Roadshow Mode</span>
                <span class="mode-description">造势活动计时</span>
            </button>
        </div>
    </main>
</body>
</html>
